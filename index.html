<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoRIDE MVP</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">🏍️ MotoRIDE</div>
        <nav id="nav-auth" style="display:none;">
            <span id="user-name"></span>
            <button onclick="app.logout()">Cerrar Sesión</button>
        </nav>
    </header>

    <main class="container">
        <section id="auth-section">
            <h2>Bienvenido</h2>
            <div class="tabs">
                <button onclick="showForm('login')">Login</button>
                <button onclick="showForm('register')">Registro</button>
            </div>

            <form id="login-form">
                <input type="email" id="login-email" placeholder="Correo" required>
                <input type="password" id="login-pass" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
            </form>

            <form id="register-form" style="display:none;">
                <input type="text" id="reg-name" placeholder="Nombre Completo" required>
                <input type="email" id="reg-email" placeholder="Correo" required>
                <input type="password" id="reg-pass" placeholder="Contraseña" required>
                <select id="reg-role">
                    <option value="client">Cliente (Pasajero)</option>
                    <option value="driver">Conductor</option>
                </select>
                <button type="submit">Registrarse</button>
            </form>
        </section>

        <section id="client-dashboard" style="display:none;">
            <h3>Solicitar Nuevo Viaje</h3>
            <form id="trip-form">
                <input type="text" id="trip-origin" placeholder="Origen" required>
                <input type="text" id="trip-dest" placeholder="Destino" required>
                <input type="text" id="trip-desc" placeholder="¿Qué enviamos?" required>
                <input type="number" id="trip-price" placeholder="Oferta (COP)" required>
                <button type="submit">Solicitar Moto</button>
            </form>
            <hr>
            <h3>Mis Viajes</h3>
            <div id="client-trips-list" class="cards-container"></div>
        </section>

        <section id="driver-dashboard" style="display:none;">
            <h3>Viajes Disponibles</h3>
            <div id="available-trips-list" class="cards-container"></div>
            <hr>
            <h3>Mis Entregas Activas</h3>
            <div id="driver-trips-list" class="cards-container"></div>
        </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/trips.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
